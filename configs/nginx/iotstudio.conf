# IoT Studio — separate addresses (used when IOT_APP_NAME is set in /opt/iotstudio/.env; deploy/render-nginx.sh fills in the two names).
#
#   example.com www.example.com   the landing page and the policy pages ONLY. No app, no sign-in, no API.
#   classroom.example.com        the app at the root of its own address: sign-in, /api/ -> Flask <api-port>, /mqtt -> Mosquitto WebSocket <mqtt-ws-port>,
#                     /serial-monitor/; /legal/ is sent on to the landing address (the app links to it).
#   @ADMIN_NAME@      the master admin panel (optional, set IOT_ADMIN_NAME): people management ONLY — accounts, plans,
#                     sign-in help. No projects, classrooms or Code Editor. Its sign-in cookie lives on this address alone.
#
# Old links keep working: https://<landing>/app/...  (invite QR codes, share links, bookmarks) is sent on to the app address.
# The demo site has its own file (iotstudio-demo.conf) and its own address.
# Works behind a Cloudflare Tunnel (cloudflared sends the visitor's address in CF-Connecting-IP).

map $http_upgrade $iot_conn_upgrade { default upgrade; '' close; }
map $http_x_forwarded_proto $iot_fwd_proto { default $scheme; https https; }

# ── the landing page ──
server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    root /opt/iotstudio/current/frontend;
    index index.html;
    server_tokens off;
    client_max_body_size 1m;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    if ($http_x_forwarded_proto = "http") { return 308 https://$host$request_uri; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    # the old app address: send people (and old QR codes, share links and bookmarks) to the app
    location ~ ^/app(/.*)?$ { return 301 https://classroom.example.com$1$is_args$args; }
    location ~ ^/serial-monitor { return 301 https://classroom.example.com$request_uri; }

    location = / { try_files /landing/index.html =404; }
    # the marketing pages have clean addresses: /platform, /makers, /schools, /colleges, /business, /pricing, /contact, /download
    location ~ ^/(platform|makers|schools|colleges|business|pricing|contact|download)/?$ {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files /landing/$1.html =404;
    }
    location /landing/ { add_header Cache-Control "no-cache"; try_files $uri =404; }
    # the self-host release zips live OUTSIDE the release tree (copied there by hand), so updates never touch them
    location /downloads/ { alias /opt/iotstudio/downloads/; add_header Cache-Control "no-cache"; }
    location /legal/ { try_files $uri $uri.html =404; }
    location = /favicon-logo.png { try_files $uri =404; expires 7d; }
    location = /robots.txt  { try_files $uri =404; }
    location = /sitemap.xml { try_files $uri =404; }

    # relaxed CSP only for these pages: Google Fonts and the page's own inline script
    location ~ ^/(landing|legal)/ {
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        try_files $uri $uri.html $uri/ =404;
    }
}

# ── the app ──
server {
    listen 80;
    listen [::]:80;
    server_name classroom.example.com;

    root /opt/iotstudio/current/frontend/iot-studio;
    index index.html;
    server_tokens off;
    client_max_body_size 2m;

    set_real_ip_from 127.0.0.1;
    set_real_ip_from ::1;
    real_ip_header CF-Connecting-IP;

    # Behind the Cloudflare Tunnel a visit that arrived as plain http is sent to https: phones refuse to keep the secure sign-in cookie over http.
    if ($http_x_forwarded_proto = "http") { return 308 https://$host$request_uri; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header X-Robots-Tag "noindex, nofollow" always;       # a sign-in page does not belong in a search engine

    # the old address /app/... (links already handed out) now means the root
    location ^~ /app { rewrite ^/app/?(.*)$ /$1 permanent; }

    # ── the app: strict CSP (no inline scripts, no third-party code) ──
    location / {
        default_type application/manifest+json;               # only files without a known type get this: the .webmanifest
        add_header Cache-Control "no-cache";                  # also keeps sw.js (the service worker) and the manifest fresh
        # NOTE: never add a "types { }" block here: it REPLACES all file types of this location (pages would download instead of open)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    }

    location = /favicon-logo.png { root /opt/iotstudio/current/frontend; try_files $uri =404; expires 7d; }
    location = /robots.txt { return 200 "User-agent: *\nDisallow: /\n"; add_header Content-Type text/plain; }

    # ── the policy pages live on the landing address (the app links to them); the serial monitor tool is part of the app ──
    location ^~ /legal/ { return 301 https://example.com$request_uri; }
    location /serial-monitor/ { root /opt/iotstudio/current/frontend; try_files $uri $uri/ /serial-monitor/index.html; }
    location ~ ^/serial-monitor/ {
        root /opt/iotstudio/current/frontend;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files $uri $uri.html $uri/ =404;
    }

    # ── building code for a board can take over a minute ──
    location = /api/flash/compile {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:<api-port>;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $iot_fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 300s;
    }

    # ── API ──
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://127.0.0.1:<api-port>;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $iot_fwd_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 60s;
    }

    # ── live data for browsers: MQTT over WebSocket ──
    location /mqtt {
        proxy_pass http://127.0.0.1:<mqtt-ws-port>/;      # the trailing slash matters
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $iot_conn_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
