# Added by the homelab hardening script.
# sshd reads sshd_config.d/*.conf in name order BEFORE sshd_config, and keeps the
# FIRST value it sees for each setting. The 00- name makes these win over
# 50-cloud-init.conf.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
PubkeyAuthentication yes
