# IoT Studio — Mosquitto broker config (production template)
#
# Users, passwords and topic permissions are NOT in files any more: the backend manages
# them through the Dynamic Security plugin (no sudo, no file editing, no reload).
#
# One-time setup on a new Pi:
#   sudo mkdir -p /var/lib/mosquitto && sudo chown mosquitto: /var/lib/mosquitto
#   sudo mosquitto_ctrl dynsec init /var/lib/mosquitto/dynamic-security.json <admin-user> '<DL_MQTT_ADMIN_PASS>'
#   sudo chown mosquitto: /var/lib/mosquitto/dynamic-security.json
# Put the same admin password in the backend's .env as DL_MQTT_ADMIN_PASS.

# Devices on the local network (plain MQTT). Do not expose this port to the internet.
listener <mqtt-port>
protocol mqtt

# Devices that should be encrypted (TLS). Certificates come from deploy/make-certs.sh; install.sh creates them.
# Remove this block if you do not want to offer encrypted MQTT.
listener <mqtts-port>
protocol mqtt
cafile /etc/mosquitto/certs/ca.crt
certfile /etc/mosquitto/certs/server.crt
keyfile /etc/mosquitto/certs/server.key
tls_version tlsv1.2

# Browsers (nginx proxies  wss://<host>/mqtt  ->  ws://127.0.0.1:<mqtt-ws-port>)
listener <mqtt-ws-port> 127.0.0.1
protocol websockets

allow_anonymous false

# Path differs per distro: Debian/Raspberry Pi OS (arm64) shown here.
plugin /usr/lib/aarch64-linux-gnu/mosquitto_dynamic_security.so
plugin_opt_config_file /var/lib/mosquitto/dynamic-security.json


# A misbehaving sketch must not be able to flood the Pi.
max_inflight_messages 20
max_queued_messages 500
message_size_limit 8192
