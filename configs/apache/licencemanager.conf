# Licence Manager. Localhost only: cloudflared brings traffic in and Cloudflare terminates TLS.
<VirtualHost 127.0.0.1:<port>>
    ServerName licences.example.net
    DocumentRoot /var/www/licencemanager/public

    <Directory /var/www/licencemanager/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/licencemanager-error.log
    CustomLog ${APACHE_LOG_DIR}/licencemanager-access.log combined
</VirtualHost>
